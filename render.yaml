services:
  - type: web
    name: legal-advisor-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: DB_PATH
        value: data_vector_db
      - key: RENDER
        value: "true"
    disk:
      name: vector-db-disk
      mountPath: /app/data_vector_db
      sizeGB: 1
     